name: PDF to Text CI

on:
  push:
    branches:
     - #main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Install Python
      # ==========================================
      - name: Install Python
        run: |
          bash ./install.sh


      # ==========================================
      # 3. Verify Python Installation
      # ==========================================
      - name: Verify Python
        run: |
          python3 --version
          pip3 --version


      # ==========================================
      # 4. Install Python Libraries
      # ==========================================
      - name: Install Python dependencies
        run: |
          python3 -m pip install -r requirements.txt


      # ==========================================
      # 5. Verify Installed Libraries
      # ==========================================
      - name: Verify dependencies
        run: |
          python3 -c "import flask; print('Flask installed successfully')"
          python3 -c "import pypdf; print('pypdf installed successfully')"


      # ==========================================
      # 6. Verify Application
      # ==========================================
      - name: Verify application
        run: |
          python3 -c "import app"
          echo "Application imported successfully"


      # ==========================================
      # 7. Start Flask Application
      # ==========================================
      - name: Start application
        run: |
          nohup python3 app.py > flask.log 2>&1 &

          echo "Waiting for Flask application..."

          sleep 3

          curl --fail http://127.0.0.1:5000

          echo "Flask application started successfully."


      # ==========================================
      # 8. Install ngrok
      # ==========================================
      - name: Install ngrok CLI
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            | sudo tar -xzf - -C /usr/local/bin

          ngrok version


      # ==========================================
      # 9. Start ngrok Tunnel
      # ==========================================
      - name: Start ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

        run: |
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          nohup ngrok http 5000 --log=stdout > ngrok.log 2>&1 &

          echo "Waiting for ngrok tunnel..."

          endpoint=""

          for attempt in {1..15}; do

            endpoint=$(
              curl -s http://127.0.0.1:4040/api/tunnels \
              | python3 -c '
          import json
          import sys

          payload = sys.stdin.read().strip()

          if payload:
              data = json.loads(payload)
              tunnels = data.get("tunnels", [])

              if tunnels:
                  print(tunnels[0].get("public_url", ""))
          ' 2>/dev/null || true
            )

            if [ -n "$endpoint" ]; then
              echo "=========================================="
              echo "ngrok tunnel started successfully"
              echo "Public URL: $endpoint"
              echo "=========================================="
              break
            fi

            echo "Attempt $attempt: ngrok endpoint not ready..."
            sleep 2

          done

          if [ -z "$endpoint" ]; then
            echo "=========================================="
            echo "ERROR: ngrok did not provide a public endpoint"
            echo "=========================================="

            echo "===== ngrok.log ====="
            cat ngrok.log

            exit 1
          fi


      # ==========================================
      # 10. Keep Application Running
      # ==========================================
      - name: Keep application available
        run: |
          echo "=========================================="
          echo "Application is running"
          echo "ngrok tunnel is running"
          echo "Keeping runner alive for 6 hours..."
          echo "=========================================="

          sleep 21600


      # ==========================================
      # 11. Show Logs
      # ==========================================
      - name: Show application logs
        if: always()
        run: |
          echo "=========================================="
          echo "Flask application logs"
          echo "=========================================="

          cat flask.log 2>/dev/null || true

          echo "=========================================="
          echo "ngrok logs"
          echo "=========================================="

          cat ngrok.log 2>/dev/null || true
