name: Stage3

on:
  workflow_run:
    workflows: ["Stage2"]
    types:
      - completed

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install ngrok CLI
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            | sudo tar -xzf - -C /usr/local/bin

      - name: Start application
        run: |
          nohup python app.py > flask.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:5000

      - name: Start ngrok tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          nohup ngrok http 5000 --log=stdout > ngrok.log 2>&1 &
          for attempt in {1..15}; do
            response=$(curl -s http://127.0.0.1:4040/api/tunnels || true)
            endpoint=$(NGROK_TUNNELS_JSON="$response" python - <<'PY'
import json
import os

raw = os.environ.get("NGROK_TUNNELS_JSON", "").strip()
if not raw:
    print("")
    raise SystemExit(0)

try:
    data = json.loads(raw)
except json.JSONDecodeError:
    print("")
    raise SystemExit(0)

tunnels = data.get("tunnels", []) if isinstance(data, dict) else []
print(next((t.get("public_url", "") for t in tunnels if isinstance(t, dict) and t.get("public_url")), ""))
PY
            )
            if [ -n "$endpoint" ]; then
              echo "Public endpoint: $endpoint"
              break
            fi
            sleep 2
          done
          if [ -z "$endpoint" ]; then
            echo "ngrok did not provide a public endpoint"
            cat ngrok.log
            exit 1
          fi

      - name: Keep tunnel available
        run: sleep 21600
