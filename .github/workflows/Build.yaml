name: Stage1

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
      
      - name: Display results
        run: |
          echo "CI pipeline is working!"
          echo "Test results:"
          pytest --maxfail=1 --disable-warnings -q
